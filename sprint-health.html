<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprint Health Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#f0f4f8;color:#1a1a2e}
.container{max-width:800px;margin:0 auto;padding:32px 20px}
h1{font-size:28px;font-weight:800;margin-bottom:4px}
.subtitle{color:#6b7280;margin-bottom:24px}
.card{background:#fff;border-radius:16px;padding:24px;border:1px solid #e5e7eb;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:16px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.metric{text-align:center;padding:16px;border-radius:12px}
.metric .value{font-size:32px;font-weight:800}
.metric .label{font-size:12px;color:#6b7280;margin-top:4px}
.metric.green{background:#ecfdf5}.metric.green .value{color:#059669}
.metric.blue{background:#eff6ff}.metric.blue .value{color:#2563eb}
.metric.yellow{background:#fffbeb}.metric.yellow .value{color:#d97706}
.metric.red{background:#fef2f2}.metric.red .value{color:#dc2626}
.bar{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin:12px 0}
.bar-fill{height:100%;border-radius:4px;background:#2563eb;transition:width 1s ease}
.insights{line-height:1.8;font-size:14px}
.insights h3{margin-bottom:12px}
.btn{display:inline-block;padding:10px 24px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.status-badge{display:inline-block;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600}
.status-green{background:#d1fae5;color:#059669}
.status-red{background:#fee2e2;color:#dc2626}
.loading{text-align:center;padding:40px;color:#6b7280}
.sprint-name{font-weight:600;font-size:18px}
@media(max-width:600px){.metrics{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container">
<a href="/" style="display:inline-flex;align-items:center;gap:6px;color:#6b7280;text-decoration:none;font-size:14px;font-weight:500;margin-bottom:20px;transition:color .2s" onmouseover="this.style.color='#2563eb'" onmouseout="this.style.color='#6b7280'">← Voltar ao Portfólio</a>
<h1>📊 Sprint Health Dashboard</h1>
<p class="subtitle">Métricas em tempo real do Jira · Recomendações via IA</p>

<div id="content" class="loading">⏳ Carregando métricas da sprint...</div>

<button class="btn" onclick="loadData()" style="margin-top:16px">🔄 Atualizar</button>
</div>

<script>
const API = '/api/sprint-health';

async function loadData() {
    document.getElementById('content').innerHTML = '<div class="loading">⏳ Carregando...</div>';
    try {
        const r = await fetch(API);
        const d = await r.json();
        if (!d.ok) throw new Error(d.error || 'Erro');
        render(d);
    } catch(e) {
        document.getElementById('content').innerHTML = `<div class="card" style="text-align:center;color:#dc2626">❌ Erro: ${e.message}</div>`;
    }
}

function render(d) {
    const statusClass = d.pct >= 60 ? 'status-green' : d.pct >= 40 ? '' : 'status-red';
    const statusLabel = d.pct >= 60 ? '🟢 No prazo' : d.pct >= 40 ? '🟡 Atenção' : '🔴 Atrasado';
    
    let html = `
    <div class="card">
        <span class="sprint-name">${d.sprint}</span>
        <span class="status-badge ${statusClass}" style="margin-left:12px">${statusLabel}</span>
        
        <div style="margin-top:16px">
            <div style="display:flex;justify-content:space-between;font-size:14px;margin:8px 0">
                <span>✅ Done: ${d.done}/${d.total}</span><span>${d.pct}%</span>
            </div>
            <div class="bar"><div class="bar-fill" style="width:${d.pct}%;background:#059669"></div></div>
        </div>
    </div>
    
    <div class="metrics">
        <div class="metric green"><div class="value">${d.done}</div><div class="label">✅ Done</div></div>
        <div class="metric blue"><div class="value">${d.in_progress}</div><div class="label">🔄 In Progress</div></div>
        <div class="metric yellow"><div class="value">${d.todo}</div><div class="label">⏳ To Do</div></div>
        <div class="metric red"><div class="value">${d.total}</div><div class="label">📋 Total</div></div>
    </div>`;
    
    if (d.insights) {
        html += `<div class="card"><div class="insights"><h3>🧠 Recomendações do Agente</h3>${d.insights.replace(/\n/g,'<br>')}</div></div>`;
    }
    
    document.getElementById('content').innerHTML = html;
}

loadData();
</script>
</body>
</html>
